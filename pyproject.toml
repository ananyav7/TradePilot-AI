[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = [
  "backend", "backtesting", "config", "database", "execution", "frontend",
  "integrations", "market_data", "notifications", "portfolio", "reports",
  "research", "risk", "scheduler", "strategy",
]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
